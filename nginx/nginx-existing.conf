# ============================================================
# Nginx Config - INTEGRAR CON NGINX EXISTENTE
# Copiar esta configuracion a tu nginx existente:
#   sudo nano /etc/nginx/sites-available/bsale-claro-sync
#   sudo ln -s /etc/nginx/sites-available/bsale-claro-sync /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requiere que el backend de Docker sea accesible desde el host.
# Opciones:
#   A) Exponer backend en 127.0.0.1:3001 (ya configurado en docker-compose.yml)
#   B) Usar docker network y proxy_pass al IP del contenedor
# ============================================================

# --- OPCION A: Backend expuesto en localhost:3001 ---
server {
    listen 80;
    server_name bsale-sync.tu-dominio.com;  # Cambia por tu subdominio

    # Si quieres SSL (Let's Encrypt):
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/bsale-sync.tu-dominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bsale-sync.tu-dominio.com/privkey.pem;

    # Frontend React (sirve archivos estaticos)
    # Opcion 1: Si frontend esta en Docker, proxy a el
    # Opcion 2: Si buildaste el frontend, sirve los archivos estaticos
    
    # Para usar con frontend en Docker (necesita exponer puerto):
    # location / {
    #     proxy_pass http://127.0.0.1:8080/;  # Si expones frontend en 8080
    # }

    # Para archivos estaticos (build local):
    # root /opt/bsale-claroshop-sync/frontend/dist;
    # index index.html;
    # try_files $uri $uri/ /index.html;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Webhooks
    location /webhooks/ {
        proxy_pass http://127.0.0.1:3001/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }
}

# --- OPCION B: Path en dominio existente ---
